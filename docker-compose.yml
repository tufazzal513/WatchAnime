version: '3.8'

services:
  movex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movex-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ROLE=main
      - DATA_DIR=/app/data
      - ADMIN_UIDS=${ADMIN_UIDS:-your-admin-uid}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-movex-513}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_CHAT_ID=${TG_CHAT_ID:-}
      - TG_KEEP=30
    volumes:
      - movex-data:/app/data

volumes:
  movex-data:
