<header id="global-header" class="fixed top-0 left-0 right-0 h-14 z-50 flex justify-between items-center px-4">
    <div class="flex items-center flex-shrink-0">
        <img id="header-logo-img" src="" alt="" class="hidden" style="display:none">
        <h1 class="nf-wordmark dynamic-app-name mb-0"></h1>
    </div>
    <div class="flex items-center gap-4 hdr-right">
        <button onclick="showPage('search-page')" class="nf-hbtn hdr-search" aria-label="Search"><i class="fas fa-search"></i><span class="hdr-search-t">Search movies, series, anime</span></button>
        <button onclick="showPage('notifications-page')" class="nf-hbtn nt-bell" aria-label="Notifications"><i class="fas fa-bell"></i><span id="bell-dot" class="nt-dot" style="display:none"></span></button>
        <button onclick="showPage('profile-page')" class="hdr-user" aria-label="Profile"><span id="header-user-name" class="hdr-uname"></span><span class="nf-avatar"><i class="fas fa-user"></i></span></button>
    </div>
</header>
