<div id="profile-page" class="page">
    <div class="pf-wrap">
        <!-- Header: avatar, name, email -->
        <div class="pf-head">
            <div class="pf-avatar"><span id="profile-initial">U</span></div>
            <div class="pf-who">
                <h3 id="profile-name" class="pf-name">Loading...</h3>
                <p id="profile-email" class="pf-mail">loading@example.com</p>
                <span class="pf-plan"><i class="fas fa-crown"></i> Free plan</span>
            </div>
        </div>

        <!-- Quick numbers -->
        <div class="pf-stats">
            <button class="pf-stat" onclick="showPage('mylist-page')"><b id="pf-count-list">0</b><span>My List</span></button>
            <button class="pf-stat" onclick="showPage('home-page')"><b id="pf-count-prog">0</b><span>In progress</span></button>
            <div class="pf-stat"><b id="pf-joined">-</b><span>Joined</span></div>
        </div>

        <!-- My space -->
        <div class="pf-group">
            <button class="pf-row" onclick="showPage('history-page')">
                <i class="pf-ic fas fa-history"></i><span class="pf-tx"><b>Watch history</b><small id="pf-hist-sub">Titles you watched recently</small></span><i class="pf-go fas fa-chevron-right"></i>
            </button>
            <button class="pf-row" onclick="showPage('mylist-page')">
                <i class="pf-ic fas fa-bookmark"></i><span class="pf-tx"><b>My List</b><small>Titles you saved to watch later</small></span><i class="pf-go fas fa-chevron-right"></i>
            </button>
            <button class="pf-row" onclick="showPage('notifications-page')">
                <i class="pf-ic fas fa-bell"></i><span class="pf-tx"><b>Notifications</b><small>Updates and announcements</small></span><i class="pf-go fas fa-chevron-right"></i>
            </button>
            <button class="pf-row" onclick="showPage('settings-page')">
                <i class="pf-ic fas fa-cog"></i><span class="pf-tx"><b>Settings</b><small id="pf-set-sub">Default video quality</small></span><i class="pf-go fas fa-chevron-right"></i>
            </button>
            <button class="pf-row" onclick="showPage('categories-page')">
                <i class="pf-ic fas fa-compass"></i><span class="pf-tx"><b>Explore</b><small>Browse by genre, language and more</small></span><i class="pf-go fas fa-chevron-right"></i>
            </button>
            <button class="pf-row" id="pf-clear-search" onclick="pfClearSearch()">
                <i class="pf-ic fas fa-history"></i><span class="pf-tx"><b>Clear search history</b><small id="pf-clear-sub">Remove your recent searches from this device</small></span><i class="pf-go fas fa-chevron-right"></i>
            </button>
        </div>

        <!-- Community links (filled from the admin settings) -->
        <h4 class="pf-h">Community</h4>
        <div id="social-links-container" class="pf-group"></div>

        <button class="pf-out" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Sign out</button>
        <p class="pf-ver" id="pf-app">&nbsp;</p>
    </div>
</div>
