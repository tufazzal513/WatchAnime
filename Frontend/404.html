<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MoveX</title>
  <!--
    GitHub Pages has no server rewrites. Any deep link (/movie/abc, /genre/action ...) lands here first.
    This page sends the visitor to index.html, which restores the original URL (see the script in index.html).
    Keep this file in the repository root next to index.html.
  -->
  <script>
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
      l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
