<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Real URLs (/movie/<id>/<name>, /genre/action ...): every asset path is relative to the site root -->
    <base href="/">
    <script>
      // GitHub Pages: 404.html sends /movie/abc?s=1 here as /?/movie/abc&s=1. Put the real URL back before the app starts.
      (function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
        }
      }(window.location));
    </script>
    <meta name="description" content="MoveX - watch anime, series and movies online.">
    <meta name="theme-color" content="#0f172a">
    <title>MoveX - Anime, Series &amp; Movies</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Player APIs -->
    <script defer src="https://player.vimeo.com/api/player.js"></script>
    <script defer src="https://www.youtube.com/iframe_api"></script>

    <script src="assets/js/user/core/theme-boot.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/user/liquid-bg.css">
    <link rel="stylesheet" href="assets/css/user/base.css">
    <link rel="stylesheet" href="assets/css/user/logo.css">
    <link rel="stylesheet" href="assets/css/user/carousel.css">
    <link rel="stylesheet" href="assets/css/user/splash-auth.css">
    <link rel="stylesheet" href="assets/css/user/general.css">
    <link rel="stylesheet" href="assets/css/user/movie-details.css">
    <link rel="stylesheet" href="assets/css/user/search.css">
    <link rel="stylesheet" href="assets/css/user/notifications.css">
    <!-- Dynamic Theme Overrides (must load last) -->
    <link rel="stylesheet" id="dynamic-theme-style" href="assets/css/user/theme.css">
    <link rel="stylesheet" href="assets/css/user/pro.css">
    <link rel="stylesheet" href="assets/css/user/movie-page.css">
    <link rel="stylesheet" href="assets/css/user/explore.css">
    <link rel="stylesheet" href="assets/css/user/profile.css">
    <!-- App shell: painted by the browser at once (no JS, no network), so a returning user never sees a blank page -->
    <style>
        #mx-shell{display:none}
        html.mx-shell-on #mx-shell{display:block;position:fixed;inset:0;z-index:40;background:var(--bg,#141414);pointer-events:none}
        #mx-shell .mxh{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 16px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent)}
        #mx-shell .mxh span{color:var(--nf,#e50914);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Roboto,'Helvetica Neue',Arial,sans-serif}
        #mx-shell .mxn{position:absolute;left:0;right:0;bottom:0;height:80px;display:flex;justify-content:space-around;align-items:center;background:rgba(0,0,0,.9);color:#9ca3af;font:12px Roboto,Arial,sans-serif}
        #mx-shell .mxn b{font-weight:400;color:#fff}
    </style>
    <script>
        // returning, logged-in user -> show the shell until the real app is ready
        try { if (localStorage.getItem('mx_li') === '1') document.documentElement.className += ' mx-shell-on'; } catch (e) {}
    </script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div id="mx-shell" aria-hidden="true"><div class="mxh"><span id="mx-shell-name">MoveX</span></div><div class="mxn"><b>Home</b><span>My List</span><span>Profile</span></div></div>
    <script>try { document.getElementById('mx-shell-name').textContent = localStorage.getItem('movex_app_name') || 'MoveX'; } catch (e) {}</script>
    <div data-include="partials/custom-modal.html"></div>
    <!-- No intro / splash screen: kept only as a hidden element for the scripts that still reference it -->
    <div id="initial-loader" style="display:none"></div>

    <!-- ZERO DELAY DOM SCRIPT: Executes instantly -->
    <script src="assets/js/user/core/splash-boot.js"></script>

    <div data-include="partials/auth.html"></div>
    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="max-w-4xl mx-auto hidden relative">
        
        <!-- Global Liquid Glass Background -->
        <div class="global-liquid-bg">
            <div class="global-blob g-blob-1"></div>
            <div class="global-blob g-blob-2"></div>
            <div class="global-blob g-blob-3"></div>
            <div class="global-glass-overlay"></div>
        </div>

        <div data-include="partials/header.html"></div>

        <main class="main-content">
            
            <!-- Home Page -->
            <div data-include="pages/home.html"></div>

            <!-- Search Page -->
            <div data-include="pages/search.html"></div>

            <!-- Premium Categories Page -->
            <div data-include="pages/categories.html"></div>

            <!-- Premium Notification Page -->
            <div data-include="pages/notifications.html"></div>
            
            <!-- Premium Category Movies Result Page -->
            <div data-include="pages/category-movies.html"></div>

            <!-- Profile Page Premium UI -->
            <div data-include="pages/profile.html"></div>

            <!-- Movie Details Page -->
            <div data-include="pages/movie-details.html"></div>
            <div data-include="pages/my-list.html"></div>
            <div data-include="pages/history.html"></div>
            <div data-include="pages/settings.html"></div>

            <!-- Watch Page Premium UI -->

        </main>

        <div data-include="partials/bottom-nav.html"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

    <!-- Loads partials/pages, then the app scripts in order -->
    <script src="assets/js/user/bootstrap.js"></script>
</body>
</html>
