<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchAnime</title>
    <script>
      // Single Page Application routing helper for GitHub Pages custom domain
      // Preserves original URL paths: /admin, /profile, /anime, /movies, /series, /watch
      try {
        var fullPath = window.location.pathname + window.location.search + window.location.hash;
        if (fullPath && fullPath !== '/') {
          sessionStorage.setItem('watchanime_redirect_path', fullPath);
        }
      } catch (e) {}
      window.location.replace('/');
    </script>
  </head>
  <body style="background-color: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif;">
    <p>Loading WatchAnime...</p>
  </body>
</html>
