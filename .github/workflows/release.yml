name: Release Binary

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: |
          cd cmd/fsb
          go mod init temp-build || true
          go mod tidy
          go build -v -o fsb .
          cp fsb ../../fsb

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: fsb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
