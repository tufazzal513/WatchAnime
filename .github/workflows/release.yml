name: Release Binary

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # মূল সমাধান: ডিরেক্টরির সব ফাইল একসাথে বিল্ড করা
      - name: Build
        run: |
          cd cmd/fsb
          go build -v -o fsb .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: cmd/fsb/fsb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
